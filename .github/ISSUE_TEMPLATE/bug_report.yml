name: Bug report
description: Report a reproducible implementation or call-quality issue without sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real patient data, or unrelated phone numbers.
  - type: input
    id: run-id
    attributes:
      label: Synthetic run ID
      description: Use the reviewed artifact directory name, if applicable.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [critical, high, medium, low, observation]
    validations:
      required: true
