name: Performance and complexity

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/benchmark.py"
      - "scenarios/**"
      - "pyproject.toml"
      - ".github/workflows/performance.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/benchmark.py"
      - "scenarios/**"
      - "pyproject.toml"
  schedule:
    - cron: "41 10 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[dev]"
      - name: Runtime, allocation, CPU, page-fault, and Big-O benchmark
        run: python scripts/benchmark.py --output build/reports/performance.json
      - name: Cyclomatic complexity
        run: radon cc src -s -a
      - name: Maintainability index
        run: radon mi src -s
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-report
          path: build/reports/performance.json
          if-no-files-found: error
