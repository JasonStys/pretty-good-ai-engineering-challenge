[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pgai-patient-simulator"
version = "1.0.0"
description = "A safety-bounded voice patient simulator for evaluating the Pretty Good AI assessment line."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jason Stys", email = "jasonstys27@gmail.com" }]
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "openai>=2.24,<3",
  "openai-agents[realtime]>=0.20,<0.21",
  "psutil>=7.2,<8",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "PyYAML>=6.0.3,<7",
  "twilio>=9.10,<10",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.9,<2",
  "build>=1.4,<2",
  "mypy>=1.19,<3",
  "pip-audit>=2.10,<3",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7.0,<8",
  "radon>=6.0.1,<7",
  "ruff>=0.15,<1",
  "types-PyYAML>=6.0.12,<7",
]
docs = [
  "openpyxl>=3.1.5,<4",
]

[project.scripts]
pgai-voicebot = "pgai_voicebot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pgai_voicebot"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pgai_voicebot"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
exclude = [".venv", "work"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "DTZ", "PTH", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]
"scripts/**/*.py" = ["S603", "S607", "E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pgai_voicebot"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["twilio.*", "psutil"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "work"]
skips = ["B101"]
